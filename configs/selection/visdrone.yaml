schema_version: 1
dataset: VisDrone2019-DET
applies_to:
- YOLOv8m_baseline
- YOLOv8m_BRSA
validation:
  split: official_val
  images: 548
  interval_epochs: 1
  evaluator: VisDrone2018-DET-toolkit_Python_port
  evaluator_commit: 005445782213e20cb91bc50a597db3dd949e749a
  ignored_regions: official_integral_image_rule
  iou_thresholds:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  max_dets:
  - 1
  - 10
  - 100
  - 500
prediction:
  checkpoint_branch: EMA
  score_threshold: 0.001
  class_aware_nms_iou: 0.7
  nms_pre: 30000
  max_det: 500
  multi_label: true
model_selection:
  primary_metric: AP_50_95
  metric_field: AP
  comparator: strict_greater_than
  tie_policy: keep_earlier_epoch
  checkpoint_name: best.pt
  selection_split: val
  test_dev_used_for_selection: false
final_evaluation:
- split: val
  checkpoint: best.pt
- split: test-dev
  checkpoint: best.pt
  selection_role: none
