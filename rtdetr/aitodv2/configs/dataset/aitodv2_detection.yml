task: detection
num_classes: 8
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/aitodv2/images/train
    ann_file: ./data/aitodv2/annotations/instances_train.json
    transforms:
      type: Compose
      ops: null
  shuffle: true
  batch_size: 8
  num_workers: 4
  drop_last: true
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/aitodv2/images/val
    ann_file: ./data/aitodv2/annotations/instances_val.json
    transforms:
      type: Compose
      ops: null
  shuffle: false
  batch_size: 8
  num_workers: 4
  drop_last: false
