__include__:
- ./brsa_aitodv2_r50vd_baseline.yml
output_dir: ./runs/brsa-rtdetr-aitodv2-brsa-s0
PResNet:
  expose_c2: true
HybridEncoder:
  use_brsa: true
  brsa:
    cr: 32
    block_size: 4
    groups: 4
    semantic_channels: 16
    windows:
    - 3
    - 5
    lambda_fg: 0.1
SetCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_brsa_fg: 0.1
