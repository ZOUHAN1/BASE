task: detection
num_classes: 80
remap_mscoco_category: true
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/coco/train2017/
    ann_file: ./dataset/coco/annotations/instances_train2017.json
    transforms:
      type: Compose
      ops: null
  shuffle: true
  batch_size: 8
  num_workers: 4
  drop_last: true
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/coco/val2017/
    ann_file: ./dataset/coco/annotations/instances_val2017.json
    transforms:
      type: Compose
      ops: null
  shuffle: false
  batch_size: 8
  num_workers: 4
  drop_last: false
